name: Noise-augmented KWS training checks

on:
  push:
    branches:
      - experiment/noise-augment-training-20261031
      - experiment/noise-kws-v3-validation-20261031
      - experiment/neural-kws-v4-temporal-cnn-20261031
      - experiment/kws-v4-crop-playback-audit-20261031
      - experiment/kws-v4-context-preservation-audit-20261031
      - experiment/kws-v41-context-preserving-train-20261031
  pull_request:
    paths:
      - "local-server/train_noise_augmented_kws.py"
      - "local-server/train_noise_kws_v3.py"
      - "local-server/train_noise_kws_v4.py"
      - "local-server/evaluate_noise_kws_v4.py"
      - "local-server/noise_kws_v4_audio.py"
      - "local-server/noise_kws_v4_model.py"
      - "local-server/tests/test_noise_kws_v4.py"
      - "local-server/audit_noise_kws_v4_crops.py"
      - "local-server/tests/test_noise_kws_v4_crop_audit.py"
      - "local-server/audit_noise_kws_v4_context.py"
      - "local-server/tests/test_noise_kws_v4_context.py"
      - "local-server/noise_kws_v41_audio.py"
      - "local-server/train_noise_kws_v41.py"
      - "local-server/evaluate_noise_kws_v41.py"
      - "local-server/tests/test_noise_kws_v41.py"
      - "local-server/diagnose_noise_kws_v3.py"
      - "local-server/noise_kws_v3_groups.py"
      - "local-server/tests/test_noise_kws_v3.py"
      - "local-server/diagnose_noise_augmented_kws.py"
      - "local-server/capture_noise_kws_wavs.py"
      - "local-server/neural_kws_trial.py"
      - "local-server/tests/test_noise_augmented_kws.py"
      - ".github/workflows/noise-augmentation-test.yml"

jobs:
  noise-training-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight NumPy only
        run: python -m pip install "numpy>=1.26,<3"
      - name: Exercise clean/noisy augmentation, supervised training, WAV recorder and model round-trip
        run: python -m unittest discover -s local-server/tests -p test_noise_augmented_kws.py -v
      - name: V3 grouped-validation, regularization and isolation tests
        run: python -m unittest discover -s local-server/tests -p test_noise_kws_v3.py -v
      - name: V4 offline temporal CNN and audio localization tests
        run: python -m unittest discover -s local-server/tests -p test_noise_kws_v4.py -v
      - name: V4 original-versus-crop review tests
        run: python -m unittest discover -s local-server/tests -p test_noise_kws_v4_crop_audit.py -v
      - name: V4 conservative-context manual audio audit tests
        run: python -m unittest discover -s local-server/tests -p test_noise_kws_v4_context.py -v
      - name: V4.1 uniform context and isolated training tests
        run: python -m unittest discover -s local-server/tests -p test_noise_kws_v41.py -v
      - name: Compile optional training and comparison scripts
        run: python -m py_compile local-server/train_noise_augmented_kws.py local-server/capture_noise_kws_wavs.py local-server/neural_kws_trial.py local-server/diagnose_noise_augmented_kws.py local-server/train_noise_kws_v3.py local-server/noise_kws_v3_groups.py local-server/diagnose_noise_kws_v3.py local-server/noise_kws_v4_audio.py local-server/noise_kws_v4_model.py local-server/train_noise_kws_v4.py local-server/evaluate_noise_kws_v4.py local-server/audit_noise_kws_v4_crops.py local-server/audit_noise_kws_v4_context.py local-server/noise_kws_v41_audio.py local-server/train_noise_kws_v41.py local-server/evaluate_noise_kws_v41.py
