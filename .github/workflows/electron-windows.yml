# Builds the Windows Electron installer (MSDS-System-Setup.exe).
# Scaffolding only — no release is published and no secrets are required.
name: Electron Windows build

on:
  workflow_dispatch:
  push:
    branches: ['feature/electron-kws-auto-start-20261014']
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run electron:test
      - name: Build renderer + package installer
        # The media downloader reads GITHUB_TOKEN only for api.github.com.
        # No personal token, release publishing, or user secrets are needed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:build
      - uses: actions/upload-artifact@v4
        with:
          name: msds-windows-installer
          path: release/*.exe
          if-no-files-found: error
