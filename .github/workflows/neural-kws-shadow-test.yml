name: Neural KWS shadow tests

on:
  push:
    branches:
      - experiment/noise-robust-neural-kws-20261030
  pull_request:
    paths:
      - "local-server/neural_kws_trial.py"
      - "local-server/prepare_neural_kws.py"
      - "local-server/tests/test_neural_kws_trial.py"
      - ".github/workflows/neural-kws-shadow-test.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dependency-free neural KWS safety tests
        run: python -m unittest discover -s local-server/tests -p test_neural_kws_trial.py -v
      - name: Verify optional trial files compile
        run: python -m py_compile local-server/prepare_neural_kws.py local-server/neural_kws_trial.py
