name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm test --if-present

  cloudflare:
    name: Worker typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: cloudflare
        run: npm install
      - working-directory: cloudflare
        run: npm run typecheck

  local-service:
    name: Local service typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: local-service
        run: npm install
      - working-directory: local-service
        run: npm run typecheck
