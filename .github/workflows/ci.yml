name: CI

on:
  push:
    branches: [main, feature/strict-help-facial-alert, feature/kws-asr-verification-trial-20261013, feature/msds-safe-service-autorecovery-20261014, feature/kws-help-second-chance-20261014, feature/kws-help-fire-disagreement-20261014, feature/kws-short-help-asr-diagnostics-20261014, feature/kws-asr-pending-timeout-20261014, feature/kws-help-90-fast-accept-20261014, feature/kws-help-90-green-accepted-20261014, feature/emotion-expression-training-20261014, feature/fer2013-official-one-command-20261014]
  pull_request:

jobs:
  web:
    name: Web build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm test --if-present

  cloudflare:
    name: Worker typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: cloudflare
        run: npm install
      - working-directory: cloudflare
        run: npm run typecheck

  local-service:
    name: Local service typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: local-service
        run: npm install
      - working-directory: local-service
        run: npm run typecheck


  emotion-dataset:
    name: Licensed emotion importer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "Pillow>=10.4"
      - name: Verify conversion and split isolation
        run: python -m unittest discover -s training/facial_distress/tests -p "test_*.py"
      - name: Check optional training script syntax without heavy torch downloads
        run: python -m py_compile training/facial_distress/import_fer2013.py training/facial_distress/import_own_photos.py training/facial_distress/train_expressions.py training/facial_distress/predict_expressions.py training/facial_distress/download_fer2013.py training/facial_distress/sync_fer2013_bundle.py training/facial_distress/run_fer2013.py

  # Regression coverage for the Python camera bridge and custom keyword spotter.
  local-camera-server:
    name: Camera + KWS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - working-directory: local-server
        run: python -m pip install -r requirements.txt
      - working-directory: local-server
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: MediaMTX release config smoke test
        working-directory: local-server
        run: python smoke_mediamtx.py
