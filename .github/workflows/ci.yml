name: CI

on:
  push:
    branches: [main, feature/strict-help-facial-alert, feature/kws-asr-verification-trial-20261013, feature/msds-safe-service-autorecovery-20261014, feature/kws-help-second-chance-20261014, feature/kws-help-fire-disagreement-20261014, feature/kws-short-help-asr-diagnostics-20261014, feature/kws-asr-pending-timeout-20261014, feature/kws-help-90-fast-accept-20261014, feature/kws-help-90-green-accepted-20261014, fix/kws-adaptive-noise-vad-20261014, fix/kws-noisy-speech-vad-denoise-20261014, feature/kws-measured-noise-reduction-20261014]
  pull_request:

jobs:
  web:
    name: Web build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm test --if-present

  cloudflare:
    name: Worker typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: cloudflare
        run: npm install
      - working-directory: cloudflare
        run: npm run typecheck

  local-service:
    name: Local service typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: local-service
        run: npm install
      - working-directory: local-service
        run: npm run typecheck


  # Regression coverage for the Python camera bridge and custom keyword spotter.
  local-camera-server:
    name: Camera + KWS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - working-directory: local-server
        run: python -m pip install -r requirements.txt
      - working-directory: local-server
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: MediaMTX release config smoke test
        working-directory: local-server
        run: python smoke_mediamtx.py
