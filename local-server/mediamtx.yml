# Minimal MSDS MediaMTX configuration.
#
# MediaMTX is downloaded from the latest GitHub release. Do not check in the
# vendor's enormous version-specific template: its obsolete/renamed keys make
# newer downloaded executables exit immediately before any RTSP listener starts.
#
# The MSDS camera bridge publishes each configured CCTV stream locally through
# FFmpeg; this relay exposes RTSP (8554), HLS (8888), WebRTC (8889), and its
# local-only admin API (9997, via MediaMTX internal auth defaults).

logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

rtsp: yes
rtspAddress: :8554
# FFmpeg publishes over TCP and the speech worker consumes RTSP over TCP.
# Avoid unnecessary UDP/multicast sockets that can collide with other apps.
rtspTransports: [tcp]

hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsAllowOrigins: ["*"]

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcAllowOrigins: ["*"]
webrtcAdditionalHosts: [127.0.0.1, localhost]

# Disable unused inbound protocols, minimizing port conflicts.
rtmp: no
srt: no

# Allow the bridge to publish any sanitized, per-camera path (cam1, cam2...).
paths:
  all_others:
    source: publisher
